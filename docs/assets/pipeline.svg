<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="422" viewBox="0 0 1440 422"><rect width="1440" height="422" rx="28" fill="#12131d"/><g font-family="Arial,Helvetica,sans-serif"><text x="46" y="55" font-size="19" letter-spacing="3" font-weight="700" fill="#c8c2d6">ONE STORY. A COMPLETE PRODUCTION PATH.</text><rect x="46" y="89" width="310" height="280" rx="20" fill="#201f2c" stroke="#3e374f"/><text x="68" y="134" font-size="22" fill="#d4a1f7" font-weight="700">01</text><text x="68" y="181" font-size="23" fill="#d4a1f7" font-weight="700">RESEARCH</text><text x="68" y="226" font-size="19" fill="#e5e0ee">Saved resources + sources</text><text x="68" y="257" font-size="19" fill="#e5e0ee">Claims, dates, proof assets</text><text x="68" y="328" font-size="18" fill="#aaa4bb">Know what is true.</text><path d="M365 225h21m-7-7 7 7-7 7" stroke="#d4a1f7" stroke-width="3" fill="none"/><rect x="396" y="89" width="310" height="280" rx="20" fill="#201f2c" stroke="#3e374f"/><text x="418" y="134" font-size="22" fill="#b8ddce" font-weight="700">02</text><text x="418" y="181" font-size="23" fill="#b8ddce" font-weight="700">IDEATE + SCRIPT</text><text x="418" y="226" font-size="19" fill="#e5e0ee">Angles, hooks, voice</text><text x="418" y="257" font-size="19" fill="#e5e0ee">Visual beats + real CTA</text><text x="418" y="328" font-size="18" fill="#aaa4bb">Know what to say.</text><path d="M715 225h21m-7-7 7 7-7 7" stroke="#d4a1f7" stroke-width="3" fill="none"/><rect x="746" y="89" width="310" height="280" rx="20" fill="#201f2c" stroke="#3e374f"/><text x="768" y="134" font-size="22" fill="#eead8a" font-weight="700">03</text><text x="768" y="181" font-size="23" fill="#eead8a" font-weight="700">FILM + EDIT</text><text x="768" y="226" font-size="19" fill="#e5e0ee">Take selection, B-roll</text><text x="768" y="257" font-size="19" fill="#e5e0ee">Captions, music, SFX, motion</text><text x="768" y="328" font-size="18" fill="#aaa4bb">Make the idea visible.</text><path d="M1065 225h21m-7-7 7 7-7 7" stroke="#d4a1f7" stroke-width="3" fill="none"/><rect x="1096" y="89" width="310" height="280" rx="20" fill="#201f2c" stroke="#3e374f"/><text x="1118" y="134" font-size="22" fill="#a5c8fa" font-weight="700">04</text><text x="1118" y="181" font-size="23" fill="#a5c8fa" font-weight="700">REVIEW + GIVE</text><text x="1118" y="226" font-size="19" fill="#e5e0ee">Encoded video checks</text><text x="1118" y="257" font-size="19" fill="#e5e0ee">Giveaway + Skool + ManyChat</text><text x="1118" y="328" font-size="18" fill="#aaa4bb">Ship a useful outcome.</text></g></svg>